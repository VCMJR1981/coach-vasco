# Supabase pauses free projects after 7 days without activity.
# This asks the intake function for the Snapshot count twice a week,
# which runs a real database query and keeps the project awake.
name: Keep the database awake
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desk/.env.production
          sparse-checkout-cone-mode: false
      - name: Ping
        run: |
          URL=$(grep '^VITE_SUPABASE_URL=' desk/.env.production | cut -d= -f2-)
          if [ -z "$URL" ]; then echo "Supabase URL not set yet, nothing to ping."; exit 0; fi
          curl -fsS --retry 3 --max-time 30 "$URL/functions/v1/intake"
